networks:
  oldlegs:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: oldlegs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oldlegs
      POSTGRES_PASSWORD: oldlegs
      POSTGRES_DB: oldlegs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - oldlegs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oldlegs -d oldlegs"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.21.0
    container_name: oldlegs_ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - oldlegs
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama-init:
    image: ollama/ollama:0.21.0
    container_name: oldlegs_ollama_init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - oldlegs
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "gemma4:31b-cloud"]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: oldlegs_api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://oldlegs:oldlegs@postgres:5432/oldlegs
      OLLAMA_BASE_URL: http://ollama:11434
      API_PORT: 8000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - oldlegs

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: oldlegs_web
    restart: unless-stopped
    # network_mode: host shares the host's network namespace so that
    # os.networkInterfaces() returns the real LAN IP (e.g. 192.168.x.x) for
    # QR code generation. Without this, the container only sees its Docker
    # bridge IP (172.18.x.x) which the phone can't reach.
    # NOTE: host networking is Linux-only. On Docker Desktop (Mac/Windows) this
    # falls back to the VM's network — QR IP detection won't work there.
    network_mode: "host"
    environment:
      # Set to the public URL where your API is reachable from the browser.
      # For local: http://localhost:8000
      # For remote/VPS: http://your-server-ip:8000 or https://api.yourdomain.com
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # API_URL is for server-side Next.js code (proxy routes, auth callback).
      # With network_mode: host, Docker DNS names (api:8000) don't resolve —
      # use localhost:8000 which reaches the api container via its port mapping.
      API_URL: http://localhost:8000
    depends_on:
      - api
